spring.application.name=activitytracking

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5433/myproject_db
spring.datasource.username=myproject_user
spring.datasource.password=myproject_pass

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:CHANGE_ME_IN_ENV_MIN_256_BITS_LONG_RANDOM_STRING}
jwt.expiration-ms=86400000