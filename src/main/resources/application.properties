spring.application.name=activitytracking

# Database connection (env-overridable so the same jar/image works locally and in Docker,
# consistent with how jwt.secret below is already externalized)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/myproject_db}
spring.datasource.username=${DB_USERNAME:myproject_user}
spring.datasource.password=${DB_PASSWORD:myproject_pass}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:CHANGE_ME_IN_ENV_MIN_256_BITS_LONG_RANDOM_STRING}
# Access token: short-lived on purpose (15 minutes) so a stolen token has a small blast radius.
jwt.expiration-ms=900000
# Refresh token: long-lived (7 days), stored server-side so it can be revoked on logout.
jwt.refresh-expiration-ms=604800000