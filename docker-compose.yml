version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: myproject-db
    environment:
      POSTGRES_DB: myproject_db
      POSTGRES_USER: myproject_user
      POSTGRES_PASSWORD: myproject_pass
    ports:
      - "5433:5432"
    volumes:
      - myproject_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  myproject_pgdata: